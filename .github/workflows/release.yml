name: Release AI Control Center

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win64
            ext: .exe
          - os: ubuntu-24.04
            target: linux-x64
            ext: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgl1-mesa-dev

      - name: Lint with Clippy (Core & Plus)
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --features plus -- -D warnings

      - name: Run unit tests (Core & Plus)
        run: |
          cargo test
          cargo test --features plus

      - name: Build Core
        run: cargo build --release

      - name: Package Core
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME:-v1.2.0}"
          mkdir -p stage-core artifacts
          if [ "${{ runner.os }}" = "Linux" ]; then
            cp "target/release/ai-control-center" "stage-core/ai-control-center-core-${VERSION}"
            chmod +x "stage-core/ai-control-center-core-${VERSION}"
            tar -czf "artifacts/ai-control-center-core-${VERSION}-linux-x64.tar.gz" -C stage-core "ai-control-center-core-${VERSION}"
          else
            cp "target/release/ai-control-center.exe" "stage-core/AI Control Center Core ${VERSION}.exe"
            powershell -NoProfile -Command "Compress-Archive -Path 'stage-core/*' -DestinationPath 'artifacts/ai-control-center-core-${VERSION}-win64.zip' -Force"
          fi

      - name: Build Plus
        run: cargo build --release --features plus

      - name: Package Plus
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME:-v1.2.0}"
          mkdir -p stage-plus artifacts
          cp help.example.md stage-plus/help.example.md
          if [ "${{ runner.os }}" = "Linux" ]; then
            cp "target/release/ai-control-center" "stage-plus/ai-control-center-plus-${VERSION}"
            chmod +x "stage-plus/ai-control-center-plus-${VERSION}"
            tar -czf "artifacts/ai-control-center-plus-${VERSION}-linux-x64.tar.gz" -C stage-plus "ai-control-center-plus-${VERSION}" help.example.md
          else
            cp "target/release/ai-control-center.exe" "stage-plus/AI Control Center Plus ${VERSION}.exe"
            powershell -NoProfile -Command "Compress-Archive -Path 'stage-plus/*' -DestinationPath 'artifacts/ai-control-center-plus-${VERSION}-win64.zip' -Force"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ai-control-center-${{ matrix.target }}
          path: artifacts/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: release-assets
        run: |
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Draft GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*